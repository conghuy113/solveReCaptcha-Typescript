name: Build legacy native npm package

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform package to build
        required: true
        default: win32-x64
        type: choice
        options:
          - win32-x64
          - linux-x64
          - darwin-x64
          - darwin-arm64

permissions:
  contents: read

concurrency:
  group: native-npm-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: >-
      ${{ inputs.platform == 'win32-x64' && 'windows-2022' ||
          inputs.platform == 'linux-x64' && 'ubuntu-22.04' ||
          inputs.platform == 'darwin-x64' && 'macos-15-intel' ||
          'macos-15' }}
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch on Windows and Linux
        if: runner.os != 'macOS'
        run: >-
          python -m pip install torch torchvision
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install worker and build dependencies
        run: python -m pip install -e . -r packaging/requirements-build.txt

      - name: Download and verify pinned model assets
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: python packaging/prepare_models.py

      - name: Build and warm-test frozen worker
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
          VISION_AI_RECAPTCHA_CACHE_DIR: ${{ runner.temp }}/recaptcha-worker-cache
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyinstaller
        run: >-
          python packaging/build_worker.py
          --platform "${{ inputs.platform }}"
          --verify-initialize

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"

      - name: Install TypeScript workspace
        run: pnpm --dir npm install --frozen-lockfile

      - name: Type-check TypeScript SDK
        run: pnpm --dir npm --filter @conghuy113/recaptcha-solver run typecheck

      - name: Test TypeScript SDK
        run: pnpm --dir npm --filter @conghuy113/recaptcha-solver run test

      - name: Build TypeScript SDK
        run: pnpm --dir npm --filter @conghuy113/recaptcha-solver run build

      - name: Create artifact directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"

      - name: Pack core npm package
        working-directory: npm/recaptcha-solver
        run: pnpm pack --out ../../artifacts/core.tgz

      - name: Pack native npm package
        working-directory: npm/platforms/${{ inputs.platform }}
        run: pnpm pack --out ../../../artifacts/platform.tgz

      - name: Install tarballs offline and exercise public API
        env:
          RECAPTCHA_SOLVER_MODEL_DIR: ${{ github.workspace }}/build/native/model-smoke
        run: node packaging/smoke_npm_install.mjs artifacts/core.tgz artifacts/platform.tgz

      - name: Write artifact summary
        run: >-
          python -c "from pathlib import Path;
          print('\n'.join(f'{p.name}: {p.stat().st_size} bytes' for p in Path('artifacts').glob('*.tgz')))"

      - name: Upload short-lived package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: recaptcha-solver-${{ inputs.platform }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
