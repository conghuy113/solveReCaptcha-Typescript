name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  compliance:
    name: License and release compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check public package metadata and release routing
        run: python packaging/check_compliance.py

  typescript:
    name: TypeScript library
    runs-on: ubuntu-latest
    env:
      RECAPTCHA_SOLVER_SKIP_MODEL_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.5"

      - name: Install locked dependencies without lifecycle downloads
        run: pnpm --dir npm install --frozen-lockfile --ignore-scripts

      - name: Type-check, test, and build
        run: |
          pnpm --dir npm --filter @conghuy113/recaptcha-solver run typecheck
          pnpm --dir npm --filter @conghuy113/recaptcha-solver run test
          pnpm --dir npm --filter @conghuy113/recaptcha-solver run build

      - name: Pack the public package
        run: |
          mkdir -p artifacts
          pnpm --dir npm/recaptcha-solver pack --out ../../artifacts/core.tgz

      - name: Install the tarball and exercise the public API
        run: node packaging/smoke_npm_install.mjs artifacts/core.tgz

      - name: Generate and validate release evidence
        run: >-
          node packaging/generate_release_evidence.mjs
          artifacts/core.tgz
          artifacts/release-evidence

      - name: Preserve dry-run SBOM and dependency licenses
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/release-evidence
          if-no-files-found: error
          retention-days: 14
